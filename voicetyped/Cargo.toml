[package]
name = "voicetyped"
version = "0.1.0"
edition = "2021"
description = "VoiceType ASR daemon — push-to-talk speech input for Fcitx5"
license = "MIT"

[features]
default = []
# 啟用 SenseVoice 引擎 (需要先建好 third_party/SenseVoice.cpp)
sensevoice = []
# Optional CPU accuracy profile; native artifacts must be supplied explicitly.
sherpa-nano = []

[build-dependencies]
cc = "1"

[dependencies]
anyhow = "1.0.104"
libc = "0.2"
cpal = "0.18.1"
rubato = "4.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = "0.6.5"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
