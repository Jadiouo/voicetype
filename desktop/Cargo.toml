[workspace]
members = ["core", "src-tauri", "text"]
default-members = ["core"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
version = "0.2.1-alpha.1"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[patch.crates-io]
portable-pty = { path = "vendor/portable-pty-0.9.0" }
