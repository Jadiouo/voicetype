name: Nano CPU diagnostic

on:
  # workflow_dispatch only works for files on the default branch, so the
  # investigation branch triggers on push of its own diagnostic files.
  push:
    branches: [fix/nano-empty]
    paths: [".github/workflows/nano-cpu-diag.yml", "desktop/tests/windows_nano_diag.py", "voicetyped/shim/**"]
  workflow_dispatch:
    inputs:
      repeats:
        description: 'Transcriptions per variant per runner'
        required: false
        default: '2'
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Rust stable
        run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop
      - name: Build pinned Windows OpenCC and dictionaries
        run: python ../scripts/build-desktop-opencc.py target/opencc --stage-tests target/debug/deps
      - name: Build pinned Windows CPU Nano runtime
        shell: pwsh
        run: |
          python ../scripts/build-desktop-native-windows.py --cache ../.scratch/windows-native-cache --output target/windows-native --jobs 2
          if ($LASTEXITCODE -ne 0) { throw 'native failed' }
          python ../scripts/build-desktop-runtime-windows.py --native target/windows-native --opencc target/opencc --output target/runtime
          if ($LASTEXITCODE -ne 0) { throw 'runtime failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nano-runtime
          path: desktop/target/runtime
          retention-days: 3

  probe:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        slot: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nano-runtime
          path: desktop/target/runtime
      - name: CPU flags
        run: python -m pip install py-cpuinfo==9.0.0
      - name: Diagnose Nano under ORT variants
        shell: pwsh
        working-directory: desktop
        run: python tests/windows_nano_diag.py --runtime target/runtime --scratch ../.scratch/nano-diag --repeats ${{ inputs.repeats || '2' }}
